<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Sistem Antrean dan Catatan Klinik</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Sistem Antrean dan Catatan Klinik</h1>

    <section>
      <h2>Antrean Loket</h2>

      <p>
        Sedang dipanggil:
        <strong id="dipanggil">-</strong>
      </p>

      <p>
        Menunggu:
        <span id="jumlah">0</span>
      </p>

      <button id="ambil">Ambil Nomor</button>

      <button id="panggil">Panggil Berikutnya</button>

      <button id="reset-antrean">Reset</button>

      <ol id="daftar"></ol>

      <h3>Riwayat Panggilan</h3>

      <ol id="riwayat-panggilan"></ol>
    </section>

    <hr />

    <section>
      <h2>Editor Catatan</h2>

      <textarea id="editor" rows="6" cols="50"></textarea>

      <p>
        <button id="undo" disabled>Undo</button>

        <button id="redo" disabled>Redo</button>

        <span id="info"></span>
      </p>
    </section>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
