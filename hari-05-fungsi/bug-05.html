<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <script defer src="app.js"></script>
</head>
<body>

  <button id="tombol">
    Klik
  </button>

  <form id="form">
    <input id="nama">

    <button type="submit">
      Simpan
    </button>
  </form>

  <div id="hasil"></div>

  <script>

    document
      .getElementById('tombol')
      .addEventListener('click', () => {
        alert('Klik');
      });

    document
      .getElementById('form')
      .addEventListener('submit', (event) => {

        event.preventDefault();

        const inputPengguna =
          document.getElementById('nama').value;

        document
          .getElementById('hasil')
          .textContent = inputPengguna;

      });

  </script>

</body>
</html>
