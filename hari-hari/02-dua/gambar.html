<!DOCTYPE html>
<html>
<head>
    <title>Welcome To Bali</title>

    <style>
      body{
    margin:20px;
}

      .banner{
    position: relative;
    width: 500px;
}

.banner img{
    width: 100%;
    display: block;
}

.banner h2{
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    margin: 0;

    font-family: Arial, sans-serif;
    font-size: 18px;
    color: #f3efef;
}

    </style>

</head>
<body>
  <div class="banner">

    <img src="bali.jpg" alt="Pantai Bali">

    <h2>Welcome to bali</h2>

</div>

</body>
</html>
