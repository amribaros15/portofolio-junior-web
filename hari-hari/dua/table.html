<!DOCTYPE html>
<html>
<head>
    <title>Tabel Sesi</title>
    <style>
        table {
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 3px double black;
            padding: 5px 10px;
            background: white;
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Sesi</th>
        <th colspan="2">Nilai 1</th>
        <th>Nilai 2</th>
    </tr>

    <tr>
        <td rowspan="3">Sesi 1</td>
        <td>80</td>
        <td>81</td>
        <td>82</td>
    </tr>

    <tr>
        <td>90</td>
        <td>91</td>
        <td>92</td>
    </tr>

    <tr>
        <td colspan="3">SAMA</td>
    </tr>
</table>

</body>
</html>
