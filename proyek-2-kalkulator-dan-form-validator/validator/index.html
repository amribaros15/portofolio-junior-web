<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Validator</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <form id="form-daftar" novalidate>

    <p>
      <label for="nama">Nama</label>

      <input
        id="nama"
        name="nama"
        autocomplete="name"
        aria-describedby="galat-nama"
      >

      <span
        id="galat-nama"
        class="galat"
        aria-live="polite">
      </span>
    </p>

    <p>
      <label for="email">Email</label>

      <input
        id="email"
        name="email"
        autocomplete="email"
        aria-describedby="galat-email"
      >

      <span
        id="galat-email"
        class="galat"
        aria-live="polite">
      </span>
    </p>

    <p>
      <label for="hp">Nomor HP</label>

      <input
        id="hp"
        name="hp"
        aria-describedby="galat-hp"
      >

      <span
        id="galat-hp"
        class="galat"
        aria-live="polite">
      </span>
    </p>

    <p>
      <label for="sandi">Kata Sandi</label>

      <input
        type="password"
        id="sandi"
        name="sandi"
        aria-describedby="galat-sandi"
      >

      <span
        id="galat-sandi"
        class="galat"
        aria-live="polite">
      </span>
    </p>

    <p>
      <label for="konfirmasi">Konfirmasi Sandi</label>

      <input
        type="password"
        id="konfirmasi"
        name="konfirmasi"
        aria-describedby="galat-konfirmasi"
      >

      <span
        id="galat-konfirmasi"
        class="galat"
        aria-live="polite">
      </span>
    </p>

    <button
      id="kirim"
      type="submit"
      disabled>
      Kirim
    </button>

  </form>

  <section
    id="ringkasan"
    hidden>
  </section>

  <script
    type="module"
    src="js/app.js">
  </script>

</body>
</html>
