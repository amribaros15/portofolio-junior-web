<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="kalkulator">

    <div
      id="layar"
      class="layar"
      aria-live="polite">
      0
    </div>

      <button
        id="tampil-riwayat"
        class="riwayat-btn">
        Riwayat
      </button>

        <ul id="riwayat" hidden></ul>

    <div id="papan" class="papan">

      <button data-aksi="hapus">C</button>
      <button data-operator="/">/</button>
      <button data-operator="*">x</button>
      <button data-aksi="hapus-satu">⌫</button>

      <button data-angka="7">7</button>
      <button data-angka="8">8</button>
      <button data-angka="9">9</button>
      <button data-operator="+">+</button>

      <button data-angka="4">4</button>
      <button data-angka="5">5</button>
      <button data-angka="6">6</button>
      <button data-operator="-">-</button>

      <button data-angka="1">1</button>
      <button data-angka="2">2</button>
      <button data-angka="3">3</button>

      <button
        data-aksi="sama"
        class="sama">
        =
      </button>      

      <button
        data-angka="0"
        class="nol">
        0
      </button>

      <button data-angka=".">.</button>

    </div>
    
  </main>

  <script
    type="module"
    src="js/app.js">
  </script>

</body>
</html>
